# Local run with the same hardening the Kubernetes manifests use (Project 2).
#   cp .env.example .env   # then set APP_SECRET_KEY
#   docker compose up --build
services:
  api:
    build:
      context: .
      target: runtime
    image: secure-invoice-api:local
    env_file: .env
    environment:
      APP_DATABASE_URL: sqlite:////data/app.db
    ports:
      - "127.0.0.1:8000:8000" # loopback only
    volumes:
      - api-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

volumes:
  api-data:
