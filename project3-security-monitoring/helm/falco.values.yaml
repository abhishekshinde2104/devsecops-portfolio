# Falco: runtime threat detection via the modern eBPF probe (no kernel module
# build, no privileged init container downloading drivers). falcosidekick
# forwards events to the same alert sink as Prometheus, so both the metric-
# based detections and the syscall-based ones land in one place.
#
# Optional: enabled only by `monitoring-up.sh --falco`. It runs as a
# privileged DaemonSet in the dedicated `falco` namespace (the one
# steady-state exemption from Pod Security restricted), because syscall
# visibility requires it.

driver:
  kind: modern_ebpf

# Modern eBPF still needs these capabilities; scoped, not full privileged.
falco:
  rules_files:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/rules.d
  json_output: true
  json_include_output_property: true
  # Only forward notable events (the sink stands in for a SIEM).
  priority: notice
  buffered_outputs: true

# Extra rules tuned to this workload: the invoice-api container is locked down
# (read-only rootfs, no shell needed), so a shell or an outbound connection
# from it is high-signal.
customRules:
  invoice-api-rules.yaml: |-
    - macro: invoice_api_container
      condition: (k8s.ns.name = "invoice-api")

    - rule: Shell in Invoice API container
      desc: A shell was spawned inside the locked-down invoice-api container.
      condition: >
        spawned_process and container and invoice_api_container
        and proc.name in (sh, bash, dash, ash, busybox)
      output: >
        Shell spawned in invoice-api (user=%user.name proc=%proc.cmdline
        container=%container.name pod=%k8s.pod.name image=%container.image.repository)
      priority: CRITICAL
      tags: [container, shell, mitre_execution, T1059]

    - rule: Write below app dir in Invoice API
      desc: Write to the read-only application directory in invoice-api.
      condition: >
        open_write and container and invoice_api_container
        and fd.name startswith /app
      output: >
        Write under /app in invoice-api (file=%fd.name proc=%proc.cmdline
        pod=%k8s.pod.name)
      priority: ERROR
      tags: [filesystem, mitre_persistence, T1543]

resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}

# Ship events to the shared alert sink via falcosidekick.
falcosidekick:
  enabled: true
  fullfqdn: false
  config:
    webhook:
      address: http://alert-sink.monitoring.svc.cluster.local:8080/alerts
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {cpu: 100m, memory: 128Mi}
