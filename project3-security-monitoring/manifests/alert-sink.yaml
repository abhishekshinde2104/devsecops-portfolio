# alert-sink: a minimal Alertmanager webhook receiver standing in for the
# SOC's SIEM / chat / paging integration. It logs every alert as one JSON
# line (shippable to any log pipeline) and serves the last 500 on GET
# /alerts so scripts/verify-detections.sh can prove end-to-end *delivery*,
# not just that a rule fired.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-sink
  namespace: monitoring
  labels: {app.kubernetes.io/name: alert-sink}
data:
  sink.py: |
    import json
    import threading
    from collections import deque
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    MAX_BODY = 1_000_000
    received = deque(maxlen=500)
    lock = threading.Lock()


    class Handler(BaseHTTPRequestHandler):
        server_version = "alert-sink"
        sys_version = ""

        def _send(self, code, payload):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_POST(self):
            if self.path != "/alerts":
                return self._send(404, {"error": "not found"})
            length = int(self.headers.get("Content-Length") or 0)
            if not 0 < length <= MAX_BODY:
                return self._send(413, {"error": "bad length"})
            try:
                payload = json.loads(self.rfile.read(length))
            except ValueError:
                return self._send(400, {"error": "invalid json"})
            for alert in payload.get("alerts", []):
                labels = alert.get("labels", {})
                record = {
                    "status": alert.get("status"),
                    "alertname": labels.get("alertname"),
                    "severity": labels.get("severity"),
                    "team": labels.get("team"),
                    "startsAt": alert.get("startsAt"),
                    "summary": alert.get("annotations", {}).get("summary"),
                    "mitre": alert.get("annotations", {}).get("mitre"),
                    "labels": labels,
                }
                with lock:
                    received.append(record)
                print(json.dumps(record), flush=True)
            return self._send(200, {"accepted": len(payload.get("alerts", []))})

        def do_GET(self):
            if self.path == "/healthz":
                return self._send(200, {"status": "ok"})
            if self.path == "/alerts":
                with lock:
                    return self._send(200, list(received))
            return self._send(404, {"error": "not found"})

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
  labels: {app.kubernetes.io/name: alert-sink}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alert-sink}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alert-sink}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sink
          image: docker.io/library/python:3.14-slim-trixie
          command: ["python", "-u", "/app/sink.py"]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
      volumes:
        - name: app
          configMap: {name: alert-sink}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
  labels: {app.kubernetes.io/name: alert-sink}
spec:
  selector: {app.kubernetes.io/name: alert-sink}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Only Alertmanager (this namespace) and falcosidekick (falco namespace) may
# deliver alerts to the sink; everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-sink-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: alert-sink}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: alertmanager}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: falco}
          podSelector:
            matchLabels: {app.kubernetes.io/name: falcosidekick}
      ports:
        - {protocol: TCP, port: 8080}
