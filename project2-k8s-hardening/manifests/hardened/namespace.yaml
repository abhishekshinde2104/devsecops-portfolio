# Dedicated namespace enforcing the "restricted" Pod Security Standard: the
# API server itself rejects any pod that runs privileged, as root, with
# added capabilities, host namespaces, hostPath volumes or without seccomp.
apiVersion: v1
kind: Namespace
metadata:
  name: invoice-api
  labels:
    app.kubernetes.io/part-of: devsecops-portfolio
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.34
