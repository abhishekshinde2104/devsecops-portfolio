# Namespace guard rails: a runaway or compromised workload cannot consume
# the node, and nobody can quietly add NodePort/LoadBalancer exposure.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: invoice-api-quota
  namespace: invoice-api
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 512Mi
    limits.cpu: "2"
    limits.memory: 1Gi
    requests.ephemeral-storage: 1Gi
    services.nodeports: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: invoice-api-defaults
  namespace: invoice-api
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
