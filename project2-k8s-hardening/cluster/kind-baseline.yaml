# "Before" cluster: kind defaults, nothing hardened.
#
# Kubernetes 1.34 is pinned on purpose: kube-bench v0.16 maps 1.32-1.34 to
# the CIS Kubernetes Benchmark v1.12, the newest benchmark it ships. A CIS
# score against a version the benchmark doesn't describe wouldn't mean much.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: p2-baseline
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
