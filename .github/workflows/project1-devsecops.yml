# Project 1 DevSecOps pipeline:
#   test -> (secrets | SAST | SCA | image scan + SBOM) -> severity gate
#
# Design notes (full write-up: project1-devsecops-api/docs/pipeline.md):
# * Scanner jobs *produce reports*; they do not decide. The final
#   `security-gate` job applies security-gate.toml to all reports at once, so
#   every scanner always runs and the summary shows the complete picture.
# * The gate fails closed: a missing report (crashed/skipped scanner) fails it.
# * Third-party actions are pinned to full commit SHAs (tag in the comment);
#   Dependabot keeps them current. Scanner images are pinned to versions.
# * Least privilege: the workflow token is read-only; only jobs that upload
#   SARIF get security-events: write.
# * Monorepo: a `changes` job decides whether Project 1 is affected; if not,
#   the scanners are skipped but the `Security gate` job still reports
#   success. (A trigger-level `paths:` filter would never report at all,
#   which deadlocks PRs when the gate is a required status check.) Every
#   `run:` step executes inside project1-devsecops-api/.

name: project1-devsecops

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-scan of main: new CVEs are published against unchanged code.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit `bash` = `bash -eo pipefail`. The implicit default is `bash -e`
    # without pipefail, so `gate | tee` would report tee's exit code and a
    # failing gate would pass (this happened on PR #2 before this fix).
    shell: bash
    working-directory: project1-devsecops-api

env:
  P1: project1-devsecops-api
  IMAGE: secure-invoice-api:${{ github.sha }}
  PYTHON_VERSION: "3.14"
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  SEMGREP_IMAGE: semgrep/semgrep:1.177.0
  SYFT_IMAGE: anchore/syft:v1.52.0
  GRYPE_IMAGE: anchore/grype:v0.119.0
  DEPCHECK_IMAGE: owasp/dependency-check:13.0.0
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # ------------------------------------------------------------------ scope
  changes:
    name: P1 / Detect changes
    runs-on: ubuntu-latest
    outputs:
      project1: ${{ steps.diff.outputs.project1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..HEAD"
          else
            # schedule, workflow_dispatch, first push: always scan everything
            echo "project1=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$range")
          echo "$files"
          if grep -qE '^(project1-devsecops-api/|\.github/workflows/project1-devsecops\.yml$|\.gitleaks\.toml$)' <<< "$files"; then
            echo "project1=true" >> "$GITHUB_OUTPUT"
          else
            echo "project1=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------ tests
  test:
    name: P1 / Lint + security regression tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project1 == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: project1-devsecops-api/requirements*.txt
      - name: Install (hash-verified)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint incl. flake8-bandit rules + format)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Pytest (coverage gate 85%)
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: |
            project1-devsecops-api/reports/junit.xml
            project1-devsecops-api/coverage.xml

  # ------------------------------------------------------------------ secrets
  secrets:
    name: P1 / Secrets scan (Gitleaks, full history)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project1 == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the tip
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
      - name: Scan the whole repository history
        run: |
          mkdir -p reports
          ./gitleaks git .. --config ../.gitleaks.toml --redact \
            --report-format json --report-path reports/gitleaks.json --exit-code 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-gitleaks
          path: project1-devsecops-api/reports/

  # ------------------------------------------------------------------ SAST
  sast:
    name: P1 / SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project1 == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit-test the custom rules
        run: docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep --test --metrics=off semgrep-rules/
      - name: Scan (community rulesets + custom rules)
        # Runs from the repo root so SARIF paths match the repository layout
        # (code-scanning annotations land on the right files). The shared
        # .github/ directory is scanned too (GitHub Actions / Dependabot rules).
        working-directory: .
        run: |
          mkdir -p "$P1/reports"
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/python --config p/owasp-top-ten --config p/jwt --config p/github-actions \
            --config "$P1/semgrep-rules/fastapi-security.yml" \
            --metrics=off --json-output="$P1/reports/semgrep.json" --sarif-output="$P1/reports/semgrep.sarif" \
            "$P1" .github
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        continue-on-error: true # needs GitHub Advanced Security on private repos
        with:
          sarif_file: project1-devsecops-api/reports/semgrep.sarif
          category: project1-semgrep
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-semgrep
          path: project1-devsecops-api/reports/

  # ------------------------------------------------------------------ SCA
  dependency-check:
    name: P1 / SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project1 == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore NVD database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: depcheck-${{ runner.os }}-${{ github.run_id }}
          restore-keys: depcheck-${{ runner.os }}-
      - name: Scan dependencies
        env:
          # Repo secret. Free key: https://nvd.nist.gov/developers/request-an-api-key
          # Without it the first NVD download is heavily rate-limited.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports/dependency-check ~/.dependency-check-data
          # Dependency-Check cannot parse pip-compile lockfiles (hash lines,
          # comments); give it plain name==version pins instead.
          python3 scripts/depcheck_input.py extract requirements.txt requirements-dev.txt -o reports/dc-input/requirements.txt
          key_arg=()
          if [ -n "$NVD_API_KEY" ]; then key_arg=(--nvdApiKey "$NVD_API_KEY"); fi
          docker run --rm --user 0:0 \
            -v "$PWD:/src" -v "$HOME/.dependency-check-data:/usr/share/dependency-check/data" \
            "$DEPCHECK_IMAGE" \
            --project secure-invoice-api \
            --scan /src/reports/dc-input/requirements.txt \
            --enableExperimental --disableOssIndex \
            --format JSON --format SARIF --format HTML \
            --out /src/reports/dependency-check \
            "${key_arg[@]}"
          sudo chown -R "$(id -u):$(id -g)" reports ~/.dependency-check-data
          # A scanner that analysed nothing reports nothing: fail unless every pin was resolved.
          python3 scripts/depcheck_input.py verify reports/dc-input/requirements.txt \
            reports/dependency-check/dependency-check-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-dependency-check
          path: project1-devsecops-api/reports/

  # ------------------------------------------------------------------ image
  image:
    name: P1 / Build image, SBOM, container + IaC + lockfile scans
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.project1 == 'true'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: project1-devsecops-api
          target: runtime
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=project1
          cache-to: type=gha,mode=max,scope=project1
      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-${{ runner.os }}-
      - name: Trivy - image (OS + Python packages + embedded secrets)
        run: |
          mkdir -p reports ~/.cache/trivy
          trivy() { docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP:/in:ro" -v "$HOME/.cache/trivy:/root/.cache/trivy" -w /src "$TRIVY_IMAGE" "$@"; }
          trivy image --input /in/image.tar --scanners vuln,secret --format json --output reports/trivy-image.json
          trivy image --input /in/image.tar --scanners vuln --skip-db-update \
            --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output reports/trivy-image.sarif
          # Misconfiguration scan of the Dockerfile and compose file
          trivy config --format json --output reports/trivy-config.json .
          # Lockfile SCA on the source tree (catches dev dependencies too)
          trivy fs --scanners vuln --skip-db-update --format json --output reports/trivy-fs.json .
      - name: Image policy (runtime user, baked-in secrets, healthcheck)
        # Dockerfile linters only see the last USER instruction in the file;
        # this checks the config of the image that will actually run.
        run: python3 scripts/image_policy.py --image-tar "$RUNNER_TEMP/image.tar" --output reports/image-policy.json
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        continue-on-error: true
        with:
          sarif_file: project1-devsecops-api/reports/trivy-image.sarif
          category: project1-trivy-image
      - name: Syft - generate SBOM (CycloneDX + SPDX)
        run: |
          docker run --rm -v "$PWD/reports:/out" -v "$RUNNER_TEMP:/in:ro" "$SYFT_IMAGE" \
            docker-archive:/in/image.tar \
            -o cyclonedx-json=/out/sbom.cdx.json -o spdx-json=/out/sbom.spdx.json
          # Syft can exit 0 with an empty file; an empty SBOM must fail the job.
          test -s reports/sbom.cdx.json && test -s reports/sbom.spdx.json
      - name: Grype - scan the SBOM
        run: |
          docker run --rm -v "$PWD/reports:/work" "$GRYPE_IMAGE" sbom:/work/sbom.cdx.json -o json > reports/grype.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-image
          path: project1-devsecops-api/reports/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            project1-devsecops-api/reports/sbom.cdx.json
            project1-devsecops-api/reports/sbom.spdx.json

  # ------------------------------------------------------------------ gate
  security-gate:
    name: P1 / Security gate
    runs-on: ubuntu-latest
    needs: [changes, test, secrets, sast, dependency-check, image]
    # Always runs, so the required status check reports on every PR.
    if: always()
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: Change detection must have succeeded
        if: needs.changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::changes job result: $CHANGES_RESULT"
          exit 1
      - name: Project 1 not affected
        if: needs.changes.outputs.project1 == 'false'
        working-directory: .
        run: echo "No Project 1 files changed; scanners skipped, nothing to gate." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.project1 == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.project1 == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.project1 == 'true'
        with:
          pattern: reports-*
          merge-multiple: true
          path: project1-devsecops-api/reports
      - name: Evaluate policy (security-gate.toml)
        if: needs.changes.outputs.project1 == 'true'
        run: |
          python scripts/security_gate.py --policy security-gate.toml --reports reports \
            --summary "$GITHUB_STEP_SUMMARY" --output reports/gate-result.json
      - name: Tests must also have passed
        if: needs.changes.outputs.project1 == 'true' && needs.test.result != 'success'
        run: |
          echo "::error::Lint/test job result: $TEST_RESULT"
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.changes.outputs.project1 == 'true'
        with:
          name: gate-result
          path: project1-devsecops-api/reports/gate-result.json
